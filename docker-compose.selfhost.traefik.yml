# Self-hosting Docker Compose fronted by an existing Traefik container.
#
# Assumes Traefik already runs elsewhere on this host with an external
# Docker network named `traefik`, a `websecure` entrypoint on :443, and a
# certResolver named `myresolver`. No ports are published to the host:
# Traefik reaches backend/frontend only over the shared `traefik` network.
#
# NOTE: this Traefik instance force-redirects its plain "web" (:80) entrypoint
# to "websecure" (--entrypoints.web.http.redirections.entryPoint.to=websecure),
# so every router here MUST run on websecure+TLS — a plain-HTTP router never
# gets a request, it 308s to https first. APP_HOST=multica.localhost cannot
# get a real Let's Encrypt cert (not publicly reachable for the ACME
# challenge), so Traefik serves its own self-signed default cert for it —
# expected locally, use `curl -k` or accept the browser warning. Real domains
# get a real cert through the same myresolver automatically.
#
# Usage:
#   cp .env.example .env
#   # Edit .env — generate JWT_SECRET with `openssl rand -hex 32` (required)
#   # Set APP_HOST (already set to multica.localhost for local testing)
#   docker compose -f docker-compose.selfhost.traefik.yml up -d
#
# Single-domain layout: Next.js rewrites proxy /v1, /api, /auth, /uploads to
# the backend internally. WebSockets (/ws) do NOT go through those rewrites,
# so a dedicated higher-priority router sends /ws straight to the backend.
# See SELF_HOSTING_ADVANCED.md ("Reverse Proxy", "Same Origin") for why.

name: multica

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multica}
      POSTGRES_USER: ${POSTGRES_USER:-multica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multica}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - multica_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-multica} -d ${POSTGRES_DB:-multica}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${MULTICA_BACKEND_IMAGE:-ghcr.io/multica-ai/multica-backend}:${MULTICA_IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/data/uploads
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-multica}:${POSTGRES_PASSWORD:-multica}@postgres:5432/${POSTGRES_DB:-multica}?sslmode=disable
      DATABASE_REPLICA_URL: ${DATABASE_REPLICA_URL:-}
      DATABASE_REPLICA_MAX_CONNS: ${DATABASE_REPLICA_MAX_CONNS:-}
      DATABASE_REPLICA_MIN_CONNS: ${DATABASE_REPLICA_MIN_CONNS:-}
      PORT: "8080"
      METRICS_ADDR: ${METRICS_ADDR:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a strong random value — generate one with 'openssl rand -hex 32'}
      # Single-domain layout: same origin for frontend and backend.
      FRONTEND_ORIGIN: https://${APP_HOST:?APP_HOST must be set, e.g. multica.example.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@multica.ai}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_TLS: ${SMTP_TLS:-}
      SMTP_TLS_INSECURE: ${SMTP_TLS_INSECURE:-false}
      SMTP_EHLO_NAME: ${SMTP_EHLO_NAME:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-west-2}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      ATTACHMENT_DOWNLOAD_MODE: ${ATTACHMENT_DOWNLOAD_MODE:-auto}
      ATTACHMENT_DOWNLOAD_URL_TTL: ${ATTACHMENT_DOWNLOAD_URL_TTL:-30m}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-}
      CLOUDFRONT_KEY_PAIR_ID: ${CLOUDFRONT_KEY_PAIR_ID:-}
      CLOUDFRONT_PRIVATE_KEY: ${CLOUDFRONT_PRIVATE_KEY:-}
      # Empty: single-domain layout keeps cookies host-only. Only set this if
      # you later split frontend/backend onto different subdomains.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      APP_ENV: ${APP_ENV:-production}
      MULTICA_DEV_VERIFICATION_CODE: ${MULTICA_DEV_VERIFICATION_CODE:-}
      MULTICA_APP_URL: https://${APP_HOST}
      MULTICA_DATABASE_STARTUP_TIMEOUT: ${MULTICA_DATABASE_STARTUP_TIMEOUT:-3m}
      MULTICA_DATABASE_CONNECT_TIMEOUT: ${MULTICA_DATABASE_CONNECT_TIMEOUT:-5s}
      MULTICA_SHUTDOWN_HOLD_DURATION: ${MULTICA_SHUTDOWN_HOLD_DURATION:-}
      MULTICA_RUNTIME_RECONNECT_GRACE: ${MULTICA_RUNTIME_RECONNECT_GRACE:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      DISABLE_WORKSPACE_CREATION: ${DISABLE_WORKSPACE_CREATION:-}
      MULTICA_CLOUD_URL: ${MULTICA_CLOUD_URL:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      # Public URL reachable from the open internet — same as APP_HOST here
      # since Traefik terminates TLS at the edge.
      MULTICA_PUBLIC_URL: https://${APP_HOST}
      MULTICA_PLUGIN_SECRET_KEY: ${MULTICA_PLUGIN_SECRET_KEY:-}
      MULTICA_PLUGIN_SURFACE_ORIGIN: ${MULTICA_PLUGIN_SURFACE_ORIGIN:-}
      MULTICA_PLUGIN_API_URL: ${MULTICA_PLUGIN_API_URL:-}
      MULTICA_PLUGIN_DIR: ${MULTICA_PLUGIN_DIR:-}
      MULTICA_DAEMON_SERVER_URL: ${MULTICA_DAEMON_SERVER_URL:-}
      # Traefik is a same-host reverse proxy here, so trust its forwarded headers.
      MULTICA_TRUSTED_PROXIES: ${MULTICA_TRUSTED_PROXIES:-172.16.0.0/12}
      MULTICA_LLM_API_KEY: ${MULTICA_LLM_API_KEY:-}
      MULTICA_LLM_BASE_URL: ${MULTICA_LLM_BASE_URL:-}
      MULTICA_LLM_DEFAULT_MODEL: ${MULTICA_LLM_DEFAULT_MODEL:-}
      MULTICA_LLM_MAX_RETRIES: ${MULTICA_LLM_MAX_RETRIES:-}
      MULTICA_LARK_SECRET_KEY: ${MULTICA_LARK_SECRET_KEY:-}
      MULTICA_LARK_HTTP_BASE_URL: ${MULTICA_LARK_HTTP_BASE_URL:-}
      MULTICA_LARK_CALLBACK_BASE_URL: ${MULTICA_LARK_CALLBACK_BASE_URL:-}
      MULTICA_SLACK_SECRET_KEY: ${MULTICA_SLACK_SECRET_KEY:-}
      MULTICA_VCS_INTEGRATION_ENABLED: ${MULTICA_VCS_INTEGRATION_ENABLED:-true}
      MULTICA_VCS_SECRET_KEY: ${MULTICA_VCS_SECRET_KEY:-}
      MULTICA_WECOM_SECRET_KEY: ${MULTICA_WECOM_SECRET_KEY:-}
      MULTICA_WECOM_MEDIA_ALLOW_CIDRS: ${MULTICA_WECOM_MEDIA_ALLOW_CIDRS:-}
      MULTICA_WECOM_TRACE: ${MULTICA_WECOM_TRACE:-}
    restart: unless-stopped
    networks:
      - multica_network
      - traefik
    labels:
      - traefik.enable=true
      # WebSocket route — must win over the frontend catch-all below.
      - traefik.http.routers.multica_ws.rule=Host(`${APP_HOST}`) && PathPrefix(`/ws`)
      - traefik.http.routers.multica_ws.entrypoints=websecure
      - traefik.http.routers.multica_ws.tls=true
      - traefik.http.routers.multica_ws.tls.certresolver=myresolver
      - traefik.http.routers.multica_ws.priority=10
      - traefik.http.routers.multica_ws.service=multica_backend
      - traefik.http.services.multica_backend.loadbalancer.server.port=8080
      - traefik.docker.network=traefik

  frontend:
    image: ${MULTICA_WEB_IMAGE:-ghcr.io/multica-ai/multica-web}:${MULTICA_IMAGE_TAG:-latest}
    depends_on:
      - backend
    environment:
      HOSTNAME: "0.0.0.0"
      REMOTE_API_URL: ${REMOTE_API_URL:-http://backend:8080}
      DOCS_URL: ${DOCS_URL:-}
      # Empty: browser calls same-origin /api and /ws on APP_HOST.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    restart: unless-stopped
    networks:
      - multica_network
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.multica_web.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.multica_web.entrypoints=websecure
      - traefik.http.routers.multica_web.tls=true
      - traefik.http.routers.multica_web.tls.certresolver=myresolver
      - traefik.http.services.multica_web.loadbalancer.server.port=3000
      - traefik.docker.network=traefik

networks:
  multica_network:
    driver: bridge
  traefik:
    external: true

volumes:
  pgdata:
  backend_uploads:
